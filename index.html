<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zhannaohua</title>
  <style>
    :root {
      --bg: #0b0d12;
      --card: #141821;
      --line: #232936;
      --text: #e7ebf3;
      --muted: #8b95a8;
      --accent: #6ea8fe;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: radial-gradient(1200px 600px at 20% -10%, #1a2340 0%, var(--bg) 55%);
      color: var(--text);
      font: 16px/1.7 -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 620px;
      padding: 40px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .7);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 13px;
      color: var(--muted);
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #3ddc97;
      box-shadow: 0 0 0 4px rgba(61, 220, 151, .15);
    }
    h1 {
      margin: 22px 0 8px;
      font-size: 34px;
      letter-spacing: -.02em;
    }
    p.lead { margin: 0 0 26px; color: var(--muted); }
    code {
      padding: 2px 7px;
      border-radius: 6px;
      background: #0d1017;
      border: 1px solid var(--line);
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--accent);
    }
    ul { margin: 0; padding-left: 0; list-style: none; }
    li {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
      font-size: 15px;
    }
    li:first-child { border-top: 0; }
    li span:first-child { width: 82px; color: var(--muted); flex: none; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge"><span class="dot"></span>本地服务器运行中</span>
    <h1>zhannaohua</h1>
    <p class="lead">项目已初始化为 Git 仓库，这是本地静态服务器返回的第一个页面。</p>

    <ul>
      <li><span>访问地址</span><span><code id="origin">http://127.0.0.1:8000</code></span></li>
      <li><span>服务</span><span>python3 -m http.server 8000</span></li>
      <li><span>目录</span><span>~/Desktop/zhannaohua</span></li>
      <li><span>分支</span><span>main · 首次提交 <code>0ec55e4</code></span></li>
    </ul>
  </main>

  <script>
    document.getElementById('origin').textContent = location.origin;
  </script>
</body>
</html>

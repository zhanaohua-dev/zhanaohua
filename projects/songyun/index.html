<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宋韵寻香 · 数字化制香</title>
<style>
:root{
  --ink:#2b1a12;
  --paper:#efe3cf;
  --cinnabar:#9c3a20;
  --ease:cubic-bezier(.22,.61,.36,1);
  --scale:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#efe3cf}
body{font-family:"Songti SC","STSong","Noto Serif SC",serif;-webkit-font-smoothing:antialiased}

/* 舞台：1920×1080 等比缩放 */
.stage{
  position:absolute;top:50%;left:50%;
  width:1920px;height:1080px;
  transform:translate(-50%,-50%) scale(var(--scale,1));
  transform-origin:center center;
  overflow:hidden;background:#efe3cf;
}

/* 屏 */
.screen{
  position:absolute;inset:0;
  opacity:0;visibility:hidden;
  transition:opacity .7s var(--ease), visibility .7s;
}
.screen.is-on{opacity:1;visibility:visible;z-index:2}
.screen__bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}

/* 热区 */
.spot{
  position:absolute;border:0;background:transparent;padding:0;
  cursor:pointer;border-radius:10px;
  transition:background-color .28s var(--ease), box-shadow .28s var(--ease), transform .28s var(--ease);
}
/* 热区完全不可见：不画底色、不画边框、不画阴影 */
.spot:hover,.spot:active,.spot:focus,.spot:focus-visible{
  background:transparent;box-shadow:none;outline:none;border:0;
}
.spot:active{transform:none}

/* 可选手卡（使用目的 / 身体状态 …） */
.pcard-layer{position:absolute;inset:0;z-index:3;pointer-events:none}
.pcard{z-index:2;pointer-events:auto}
/* 卡片浮起后，原位留一个纸色凹位，不再露出底图里的那一张 */
/* 卡片浮起后原位只留纸面，不画边框/阴影，避免看起来像第二张卡 */
.pslot{
  position:absolute;border-radius:11px;pointer-events:none;z-index:1;
  background:#e3d5c0;
  opacity:0;transition:opacity .3s var(--ease);
}
.pcard:hover + .pslot{opacity:1}
.pcard{
  position:absolute;border-radius:0;overflow:visible;
  cursor:pointer;transform-origin:center center;
  transition:transform .55s var(--ease), box-shadow .45s var(--ease);
  will-change:transform;
  background:#efe3cf;
}
/* 图完整保留：只做极小的上下浮动，不裁内容 */
.pcard img{display:block;width:100%;height:100%;object-fit:cover}
/* 悬停：整张卡片浮起并轻微上下呼吸，图本身不动 */
.pcard:hover{
  animation:cardLift 3.2s ease-in-out infinite alternate;
  box-shadow:0 38px 62px -26px rgba(90,48,20,.55), 0 8px 18px -8px rgba(90,48,20,.35);
}
@keyframes cardLift{
  from{transform:translateY(-5px)}
  to{transform:translateY(-1px)}
}
.pcard.is-on{filter:drop-shadow(0 0 0 rgba(0,0,0,0)) drop-shadow(0 14px 26px rgba(90,48,20,.35))}
.pcard.is-on img{filter:drop-shadow(0 0 3px rgba(156,58,32,.85)) drop-shadow(0 0 1px rgba(156,58,32,.9))}

/* 使用场景：悬停/选中 → 同一张图提亮 + 拱形框内叠 50% 白 */
.scene-layer{position:absolute;inset:0;z-index:3;pointer-events:none}
.scene-card{position:absolute;pointer-events:auto;cursor:pointer}
.scene-card img{
  position:absolute;left:0;top:0;width:100%;height:100%;display:block;
  pointer-events:none;user-select:none;-webkit-user-drag:none;
}
/* 同一张图：选中/悬停只是把它提亮（框内宣纸跟着发白） */
.scene-card__art{transition:filter .38s var(--ease)}
.scene-card:hover .scene-card__art,
.scene-card.is-on .scene-card__art{
  filter:brightness(var(--scene-lit,1.05));
}

/* 香料配方：悬停香气出详情（不可点击） */
.scent-layer{position:absolute;inset:0;z-index:3;pointer-events:none}
.scent-hit{pointer-events:auto}
.scent-hit{position:absolute;border-radius:50%;cursor:default}
.scent-disc{
  position:absolute;border-radius:50%;background:#a7734c;opacity:0;
  transition:opacity .28s var(--ease);pointer-events:none;z-index:2;
}
.scent-txt{
  position:absolute;height:auto;opacity:0;pointer-events:none;
  transition:opacity .28s var(--ease);z-index:3;
}
.scent-txt.is-white{filter:brightness(0) invert(1)}
.scent-tip{
  position:absolute;z-index:4;pointer-events:none;
  display:flex;align-items:center;
  padding:4px 30px;font-size:30px;line-height:1.58;letter-spacing:.01em;
  color:#ffffff;
  opacity:0;transform:translateY(8px);
  transition:opacity .26s var(--ease), transform .26s var(--ease);
}
/* 底色块 + 白描边都过一遍噪声位移，做出毛笔勾边的毛糙感 */
.scent-tip::before{
  content:"";position:absolute;inset:2px;border-radius:14px;
  background:#a7734c;
  filter:url(#brushEdge);
  z-index:-1;
}
.scent-tip::after{
  content:"";position:absolute;inset:-4px;border-radius:15px;
  border:6px solid #ffffff;
  filter:url(#brushEdge);
  z-index:-1;
}
.scent-tip.is-on{opacity:1;transform:none}

/* 胶囊按钮：悬停时底色变深 + 复用原白字 */
.btnfill{padding:0;border:0;background:transparent;border-radius:10px;overflow:hidden}
.btnfill__bg{position:absolute;inset:0;background:#88400e;opacity:0;transition:opacity .22s var(--ease)}
.btnfill__txt{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:78%;height:auto;opacity:0;transition:opacity .22s var(--ease);
  pointer-events:none;
}
.btnfill:hover .btnfill__bg{opacity:1}
.btnfill:hover .btnfill__txt{opacity:1}
.btnfill:active .btnfill__bg{opacity:.92}

/* 打印完成：三张香方卡依次落在画面正中（864×605，正好压住中轴） */
/* 只做不透明度交叉淡入淡出：不缩放、不位移，避免“跳一下”的卡顿感 */
.print-layer{position:absolute;inset:0;z-index:5;pointer-events:none}
.print-card{
  position:absolute;left:50%;top:50%;
  width:45%;height:56.02%;            /* 864×605 / 1920×1080 */
  transform:translate(-50%,-50%);
  opacity:0;
  transition:none;                    /* 硬切：不要淡入淡出、不要缩放 */
  border-radius:3px;overflow:hidden;
  box-shadow:0 40px 76px -30px rgba(58,34,14,.5), 0 10px 26px -14px rgba(58,34,14,.32);
}
.print-card.is-on{opacity:1}
.print-card img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
#stage.no-fade .screen{transition:none !important}

/* 加载动画 */
.loading__bar{
  position:absolute;left:50%;top:52%;
  width:520px;height:2px;transform:translateX(-50%);
  background:rgba(43,26,18,.18);overflow:hidden;
}
.loading__bar i{display:block;height:100%;width:0;background:#9c3a20;animation:fill 2.1s ease-in-out forwards}
@keyframes fill{from{width:0}to{width:100%}}

/* 控制条 */
.hud{
  position:fixed;right:22px;bottom:20px;z-index:50;
  display:flex;align-items:center;gap:8px;
  padding:7px 10px;border-radius:999px;
  background:rgba(28,18,12,.55);
  backdrop-filter:blur(10px);
  border:1px solid rgba(240,225,200,.16);
  opacity:.5;transition:opacity .3s;
  color:#f3e8d5;font-size:12px;letter-spacing:.08em;
}
.hud:hover,.hud:focus-within{opacity:1}
.hud button{
  width:26px;height:26px;border-radius:50%;border:1px solid rgba(240,225,200,.22);
  background:transparent;color:#f3e8d5;cursor:pointer;line-height:1;font-size:13px;
  display:grid;place-items:center;transition:background-color .2s,border-color .2s;
}
.hud button:hover{background:rgba(240,225,200,.14);border-color:rgba(240,225,200,.4)}
.hud__page{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.hud__name{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(243,232,213,.7)}

/* 首屏提示 */
.hint{
  position:absolute;left:50%;bottom:64px;transform:translateX(-50%);
  font-size:15px;letter-spacing:.35em;color:rgba(43,26,18,.55);
  opacity:0;transition:opacity .5s;
}
.screen.is-on .hint{opacity:1;animation:hint 2.4s ease-in-out infinite}
@keyframes hint{0%,100%{opacity:.35}50%{opacity:.75}}

/* 调试网格（?grid=1） */
.grid-overlay{position:absolute;inset:0;pointer-events:none;z-index:9;display:none}
.grid-overlay.is-on{display:block}
.grid-overlay::before{
  content:"";position:absolute;inset:0;
  background-image:linear-gradient(to right, rgba(0,0,0,.18) 1px, transparent 1px),
                   linear-gradient(to bottom, rgba(0,0,0,.18) 1px, transparent 1px);
  background-size:10% 10%, 10% 10%;
}
.grid-overlay .box{position:absolute;border:2px solid #00c2ff;background:rgba(0,194,255,.18);font-size:12px;color:#003b52;font-family:monospace;padding:1px 3px}
</style>

  home: document.getElementById('hudHome'),
};

/* ── 构建 DOM ── */
const nodes = {};
SCREENS.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'screen';
  el.dataset.screen = s.id;

  const img = document.createElement('img');
  img.className = 'screen__bg';
  img.src = s.img;
  img.alt = s.name;
  img.draggable = false;
  img.loading = i < 3 ? 'eager' : 'lazy';
  el.appendChild(img);

  if (s.cards) {
    const layer = document.createElement('div');
    layer.className = 'pcard-layer';
    s.cards.forEach((c, ci) => {
      const card = document.createElement('div');
      card.className = 'pcard';
      card.dataset.key = c.key;
      card.style.left = c.x + '%';
      card.style.top = c.y + '%';
      card.style.width = c.w + '%';
      card.style.height = c.h + '%';
      const im = document.createElement('img');
      im.src = c.img + '?v=' + IMG_V;
      im.alt = '';
      im.draggable = false;
      card.appendChild(im);
      layer.appendChild(card);

      const slot = document.createElement('div');
      slot.className = 'pslot';
      slot.style.left = c.x + '%';
      slot.style.top = c.y + '%';
      slot.style.width = c.w + '%';
      slot.style.height = c.h + '%';
      if (c.slot) slot.style.background = c.slot;
      layer.appendChild(slot);
    });
    el.appendChild(layer);
  }

  /* 香料配方：悬停香气 → 圆变深 + 字变白 + 弹详情（不可点击） */
  if (s.scents) {
    const layer = document.createElement('div');
    layer.className = 'scent-layer';
    const discs = {}, txts = {}, tips = {};

    s.scents.forEach(sc => {
      const dk = sc.disc.x + '_' + sc.disc.y;
      if (!discs[dk]) {
        const d = document.createElement('div');
        d.className = 'scent-disc';
        Object.assign(d.style, { left: sc.disc.x + '%', top: sc.disc.y + '%', width: sc.disc.w + '%', height: sc.disc.h + '%' });
        layer.appendChild(d);
        discs[dk] = d;
      }
      sc.txt.forEach(t => {
        if (txts[t.k]) return;
        const im = document.createElement('img');
        im.className = 'scent-txt';
        im.src = 'img/scent-' + t.k + '.webp?v=' + IMG_V;
        im.alt = '';
        /* 与设计稿完全同尺寸：宽度对齐原字，高度按图片比例，垂直居中到原 bbox */
        im.style.left = t.x + '%';
        im.style.width = t.w + '%';
        im.onload = () => {
          const hr = im.naturalHeight / im.naturalWidth;
          const dh = (t.w * 1920 * hr) / 1080;      /* 显示高度（%） */
          im.style.height = dh.toFixed(2) + '%';
          im.style.top = (t.y + (t.h - dh) / 2).toFixed(2) + '%';
        };
        layer.appendChild(im);
        txts[t.k] = im;
      });
      const tip = document.createElement('div');
      tip.className = 'scent-tip';
      Object.assign(tip.style, { left: sc.tip.x + '%', top: sc.tip.y + '%', width: sc.tip.w + '%', height: sc.tip.h + '%' });
      tip.textContent = sc.text;
      layer.appendChild(tip);
      tips[sc.key] = tip;
    });

    const reset = () => {
      Object.values(discs).forEach(d => d.style.opacity = 0);
      Object.values(txts).forEach(t => { t.style.opacity = 0; t.classList.remove('is-white'); });
      Object.values(tips).forEach(t => t.classList.remove('is-on'));
    };

    s.scents.forEach(sc => {
      const hit = document.createElement('div');
      hit.className = 'scent-hit';
      Object.assign(hit.style, { left: sc.hit.x + '%', top: sc.hit.y + '%', width: sc.hit.w + '%', height: sc.hit.h + '%' });
      hit.addEventListener('mouseenter', () => {
        reset();
        const d = discs[sc.disc.x + '_' + sc.disc.y];
        if (d) d.style.opacity = 1;
        sc.txt.forEach(t => {
          const im = txts[t.k];
          if (!im) return;
          im.style.opacity = 1;
          im.classList.toggle('is-white', t.k === sc.key);
        });
        if (tips[sc.key]) tips[sc.key].classList.add('is-on');
      });
      layer.appendChild(hit);
    });

    layer.addEventListener('mouseleave', reset);
    el.appendChild(layer);
  }

  /* 使用场景：框内宣纸 + 人物素材两层，悬停/选中时亮起 */
  if (s.hotcards) {
    const layer = document.createElement('div');
    layer.className = 'scene-layer';
    s.hotcards.forEach(c => {
      const card = document.createElement('div');
      card.className = 'scene-card';
      card.dataset.key = c.key;
      Object.assign(card.style, { left: c.x + '%', top: c.y + '%', width: c.w + '%', height: c.h + '%' });

      const art = document.createElement('img');
      art.className = 'scene-card__art';
      art.src = c.art + '?v=' + IMG_V;
      art.alt = '';
      art.draggable = false;

      card.append(art);
      layer.appendChild(card);
    });
    el.appendChild(layer);
  }

  if (s.print) {
    const layer = document.createElement('div');
    layer.className = 'print-layer';
    s.print.frames.forEach(src => {
      const card = document.createElement('div');
      card.className = 'print-card';
      const im = document.createElement('img');
      im.src = src + '?v=' + IMG_V;
      im.alt = '';
      im.decoding = 'sync';
      im.draggable = false;
      /* 先把三张卡解码好，动画时只做合成，不会在淡入瞬间卡一下 */
      if (im.decode) im.decode().catch(() => {});
      card.appendChild(im);
      layer.appendChild(card);
    });
    el.appendChild(layer);
  }

  if (s.loading) {
    const bar = document.createElement('div');
    bar.className = 'loading__bar';
    bar.innerHTML = '<i></i>';
    el.appendChild(bar);
  }

  (s.spots || []).forEach(sp => {
    const b = document.createElement('button');
    b.className = 'spot' + (sp.btn ? ' btnfill' : '');
    b.style.left = sp.x + '%';
    b.style.top = sp.y + '%';
    b.style.width = sp.w + '%';
    b.style.height = sp.h + '%';
    if (sp.btn) {
      const bgEl = document.createElement('span');
      bgEl.className = 'btnfill__bg';
      b.appendChild(bgEl);
      const lab = document.createElement('img');
      lab.className = 'btnfill__txt';
      lab.src = sp.btn + '?v=' + IMG_V;
      lab.alt = '';
      b.appendChild(lab);
    }
    b.setAttribute('aria-label', sp.label || (sp.go ? '前往' + s.name : '继续'));
    if (sp.go) b.dataset.go = sp.go;
    if (sp.wait) b.dataset.wait = sp.wait;
    if (sp.alt) b.dataset.alt = sp.alt;
    if (sp.cycle) b.dataset.cycle = sp.cycle.join('|');
    if (sp.target) b.dataset.target = sp.target;
    el.appendChild(b);
  });

  if (s.hint) {
    const h = document.createElement('div');
    h.className = 'hint';
    h.textContent = s.hint;
    el.appendChild(h);
  }

  stage.appendChild(el);
  nodes[s.id] = { el, img, spec: s };
});

/* ── 路由 ── */
let current = 'home';
let autoTimer = null;
let printTimers = [];
const history = [];

function clearPrintTimers() {
  printTimers.forEach(clearTimeout);
  printTimers = [];
}

/* 三张图一秒一张直接硬切，不做任何过渡； 3s 时一并消失并硬切回图四 */
function playPrint(spec, el) {
  const cards = [...el.querySelectorAll('.print-card')];
  cards.forEach(c => c.classList.remove('is-on'));
  /* 第一张立刻出现（不靠定时器，避免第一帧晚到） */
  if (cards[0]) cards[0].classList.add('is-on');
  spec.frames.slice(1).forEach((_, i) => {
    const n = i + 1;
    printTimers.push(setTimeout(() => cards[n] && cards[n].classList.add('is-on'), n * spec.step));
  });
  printTimers.push(setTimeout(() => {
    cards.forEach(c => c.classList.remove('is-on'));
    go(spec.back);
  }, spec.hold));
}

function render(id) {
  const node = nodes[id];
  if (!node) return;
  /* 进/出「打印中」这一屏：屏幕本身也硬切，不跟页面通用的 0.7s 淡入淡出 */
  const instant = id === 'printing' || current === 'printing';
  if (instant) stage.classList.add('no-fade');
  Object.values(nodes).forEach(n => n.el.classList.remove('is-on'));
  node.el.classList.add('is-on');
  if (instant) requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('no-fade')));

  current = id;
  const idx = SCREENS.findIndex(s => s.id === id);
  hud.page.textContent = (idx + 1) + ' / ' + SCREENS.length;
  hud.name.textContent = node.spec.name;
  history.push(id);
  if (history.length > 60) history.shift();
  location.hash = id;

  clearTimeout(autoTimer);
  clearPrintTimers();
  if (node.spec.auto) {
    autoTimer = setTimeout(() => go(node.spec.auto.go), node.spec.auto.delay);
  }
  if (node.spec.print) playPrint(node.spec.print, node.el);

  /* 预热相邻屏：下载 + 解码都做完，切屏和淡入就不会卡一帧 */
  const next = SCREENS[(idx + 1) % SCREENS.length];
  if (next && !nodes[next.id].img.dataset.warm) {
    const p = new Image();
    p.src = next.img;
    if (p.decode) p.decode().catch(() => {});
    nodes[next.id].img.dataset.warm = '1';
  }
}

function go(id) {
  if (!nodes[id]) return;
  render(id);
}

/* ── 交互 ── */
stage.addEventListener('click', e => {
  /* 使用场景：单选，再点一下取消 */
  const hc = e.target.closest('.scene-card');
  if (hc) {
    const wasOn = hc.classList.contains('is-on');
    hc.parentElement.querySelectorAll('.scene-card').forEach(c => c.classList.remove('is-on'));
    if (!wasOn) hc.classList.add('is-on');
    return;
  }

  /* 卡片选择：单选，不跳页 */
  const card = e.target.closest('.pcard');
  if (card) {
    card.parentElement.querySelectorAll('.pcard').forEach(c => c.classList.remove('is-on'));
    card.classList.add('is-on');
    return;
  }

  const spot = e.target.closest('.spot');
  if (!spot) return;

  /* 选中态换图 */
  if (spot.dataset.alt) {
    const node = nodes[current];
    const target = node.spec.spots.find(s => s.alt === spot.dataset.alt);
    if (target && target._on) {
      target._on = false;
      node.img.src = node.spec.img;
    } else if (target) {
      target._on = true;
      node.img.src = node.spec.alt;
    }
    return;
  }

  /* 停一会儿再自动回首页（结束页「前往线下体验」） */
  if (spot.dataset.wait) {
    clearTimeout(autoTimer);
    autoTimer = setTimeout(() => go('home'), +spot.dataset.wait);
    return;
  }

  if (spot.dataset.go) go(spot.dataset.go);
});

hud.prev.addEventListener('click', () => {
  const idx = SCREENS.findIndex(s => s.id === current);
  go(SCREENS[(idx - 1 + SCREENS.length) % SCREENS.length].id);
});
hud.next.addEventListener('click', () => {
  const idx = SCREENS.findIndex(s => s.id === current);
  go(SCREENS[(idx + 1) % SCREENS.length].id);
});
hud.home.addEventListener('click', () => go('home'));

addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') hud.next.click();
  else if (e.key === 'ArrowLeft') hud.prev.click();
  else if (e.key === 'Escape') go('home');
});

/* ── 等比缩放 ── */
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.documentElement.style.setProperty('--scale', s.toFixed(5));
}
addEventListener('resize', fit, { passive: true });
fit();

/* ── 启动：支持 #screen 直达 ── */
const startId = location.hash.slice(1);
render(nodes[startId] ? startId : 'home');

/* hash 变化（前进/后退、手改地址）也要跟着走 */
addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (nodes[id] && id !== current) render(id);
});

/* ── 调试：?pick=huizuo 直接点亮某张场景卡（截图/对稿用） ── */
const pickKey = new URLSearchParams(location.search).get('pick');
if (pickKey) {
  addEventListener('load', () => {
    setTimeout(() => {
      const c = document.querySelector('.scene-card[data-key="' + pickKey + '"]');
      if (c) c.classList.add('is-on');
    }, 260);
  });
}

/* ── 调试网格：?grid=1 ── */
if (new URLSearchParams(location.search).get('grid') === '1') {
  const ov = document.createElement('div');
  ov.className = 'grid-overlay is-on';
  document.getElementById('stage').appendChild(ov);
  /* 每屏的热区框也要画出来（仅当前屏） */
  const draw = () => {
    ov.querySelectorAll('.box').forEach(b => b.remove());
    const node = nodes[current];
    (node.spec.spots || []).forEach(sp => {
      const b = document.createElement('div');
      b.className = 'box';
      b.style.left = sp.x + '%'; b.style.top = sp.y + '%';
      b.style.width = sp.w + '%'; b.style.height = sp.h + '%';
      b.textContent = sp.go || sp.alt || sp.cycle ? 'click' : '';
      ov.appendChild(b);
    });
  };
  draw();
  setInterval(draw, 500);
}
</script>
</body>
</html>
